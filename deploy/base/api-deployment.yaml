apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobsearch-api
  labels:
    app.kubernetes.io/name: jobsearch-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: jobsearch-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jobsearch-api
    spec:
      # Spread replicas across nodes so a single node loss can't take the API fully down.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: jobsearch-api
      containers:
        - name: api
          image: jobsearch-backend
          args: ["api"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: jobsearch-config
          env:
            # DATABASE_URL is assembled from the CNPG-generated Secret (keys: uri).
            # k3s-lab's CNPG Cluster is named `jobsearch-db`; its app secret is
            # `jobsearch-db-app` with a ready-to-use `uri` key.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: jobsearch-db-app
                  key: uri
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: jobsearch-ai
                  key: ANTHROPIC_API_KEY
                  optional: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
