# Web served as an Argo Rollout with a blue-green strategy (see api-deployment.yaml).
#   - activeService:  jobsearch-web
#   - previewService: jobsearch-web-preview
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: jobsearch-web
  labels:
    app.kubernetes.io/name: jobsearch-web
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: jobsearch-web
  strategy:
    blueGreen:
      activeService: jobsearch-web
      previewService: jobsearch-web-preview
      autoPromotionEnabled: true
      autoPromotionSeconds: 30
      scaleDownDelaySeconds: 30
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jobsearch-web
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: jobsearch-web
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: jobsearch-web
      containers:
        - name: web
          image: jobsearch-web
          ports:
            - containerPort: 3000
          # NOTE: NEXT_PUBLIC_API_URL is baked into the image at BUILD time (Next.js
          # inlines NEXT_PUBLIC_* during `next build`). Setting it here has no effect on
          # the browser bundle; rebuild the web image with the right --build-arg instead.
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
