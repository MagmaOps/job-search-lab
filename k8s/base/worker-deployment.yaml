apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobsearch-worker
  labels:
    app.kubernetes.io/name: jobsearch-worker
  annotations:
    # A Deployment's spec.selector is immutable, so any selector change (e.g. toggling
    # kustomize includeSelectors) can't be patched in place. Tell ArgoCD to replace the
    # object instead of patching it. Safe here: the worker is stateless (leader election
    # is via a Postgres advisory lock), so a brief recreate never interrupts collection.
    argocd.argoproj.io/sync-options: Replace=true
spec:
  # Two replicas for failover; LEADER_ELECTION ensures only one collects at a time
  # (Postgres advisory-lock leader election in the worker). If the leader's node dies,
  # the standby acquires the lock and takes over automatically.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: jobsearch-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jobsearch-worker
    spec:
      # Spread the two worker replicas across zones then nodes so the standby (which takes
      # over leader election if the active worker's node/zone dies) is never co-located.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: jobsearch-worker
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: jobsearch-worker
      containers:
        - name: worker
          image: jobsearch-backend
          args: ["worker"]
          envFrom:
            - configMapRef:
                name: jobsearch-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: jobsearch-db-app
                  key: uri
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: jobsearch-ai
                  key: ANTHROPIC_API_KEY
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
