# API served as an Argo Rollout with a blue-green strategy.
#   - activeService:  jobsearch-api         (what the ingress + web talk to)
#   - previewService: jobsearch-api-preview (the new version, reachable for smoke tests
#                                            before promotion)
# On a new image tag, Rollouts brings up the green ReplicaSet behind the preview service,
# waits, then flips the active service's selector to green and scales blue down.
# Requires the Argo Rollouts controller in the cluster (installed via k3s-lab platform).
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: jobsearch-api
  labels:
    app.kubernetes.io/name: jobsearch-api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: jobsearch-api
  strategy:
    blueGreen:
      activeService: jobsearch-api
      previewService: jobsearch-api-preview
      # Hold the new version on the preview service for a smoke window, then auto-promote.
      # Set autoPromotionEnabled: false to require a manual `kubectl argo rollouts promote`.
      autoPromotionEnabled: true
      autoPromotionSeconds: 30
      # Keep the old ReplicaSet for 30s after promotion for an instant rollback.
      scaleDownDelaySeconds: 30
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jobsearch-api
    spec:
      # HA: spread replicas across zones first, then nodes, so a zone or node loss never
      # takes the whole service down. ScheduleAnyway keeps scheduling best-effort on a
      # small homelab that may not have perfectly balanced zones.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: jobsearch-api
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: jobsearch-api
      containers:
        - name: api
          image: jobsearch-backend
          args: ["api"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: jobsearch-config
          env:
            # DATABASE_URL is assembled from the CNPG-generated Secret (keys: uri).
            # k3s-lab's CNPG Cluster is named `jobsearch-db`; its app secret is
            # `jobsearch-db-app` with a ready-to-use `uri` key pointing at the -rw Service.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: jobsearch-db-app
                  key: uri
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: jobsearch-ai
                  key: ANTHROPIC_API_KEY
                  optional: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
