apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base manifests for the job-search app. Consumed and patched by the k3s-lab repo.
# This base intentionally contains NO homelab-specific values:
#   - image tags, replicas, resources, ingress host, storage class → patched in overlays
#   - DB credentials → provided by the CloudNativePG-generated Secret (jobsearch-db-app)
#   - Anthropic key → provided by a Secret sealed in k3s-lab (jobsearch-ai)

resources:
  - configmap.yaml
  - api-deployment.yaml
  - api-service.yaml
  - worker-deployment.yaml
  - web-deployment.yaml
  - web-service.yaml
  - pdb.yaml
  - ingress.yaml

# Images live on Docker Hub under magmakomer. The k3s-lab workload overlay pins the exact
# version tag (e.g. v1.0.0); this base default is only used for a standalone `kustomize build`.
images:
  - name: jobsearch-backend
    newName: magmakomer/jobsearch-backend
    newTag: v1.5.1
  - name: jobsearch-web
    newName: magmakomer/jobsearch-web
    newTag: v1.5.1

# Add the part-of label as metadata only. includeSelectors MUST stay false: Argo Rollouts
# manages the blue-green Service selectors itself and validates them against the Rollout's
# pod labels — injecting an extra label into the Service selector makes it reject the spec
# with "Service ... has unmatch label ... in rollout" and no pods are created.
labels:
  - pairs:
      app.kubernetes.io/part-of: job-search-lab
    includeSelectors: false
