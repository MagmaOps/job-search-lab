# .github/workflows/release.yml
#
# Merging to main validates, then publishes both images to Docker Hub. The image tag is
# the version in k8s/base/kustomization.yaml (no git tags). Only runs when something that
# ends up in an image changes, so docs-only commits don't republish. Replaces
# ./build-push.sh.

name: Release images

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'web/**'
      - 'k8s/base/kustomization.yaml'
  workflow_dispatch:

jobs:
  validate:
    uses: MagmaOps/k3s-lab-ci/.github/workflows/job-search-lab-validate.yaml@main
    with:
      ref: ${{ github.sha }}
    secrets: inherit

  publish:
    needs: validate
    uses: MagmaOps/k3s-lab-ci/.github/workflows/job-search-lab-publish.yaml@main
    with:
      ref: ${{ github.sha }}
    secrets: inherit
